version: "3.8"

# Build with:  docker compose build
# Run with:    docker compose run --rm saga
#
# BuildKit is required for --mount=type=cache in the Dockerfile.
# Modern Docker (23+) enables it by default. If you get a syntax error,
# prefix the build command with: DOCKER_BUILDKIT=1

services:
  saga:
    build:
      context: .
      dockerfile: Dockerfile
    image: saga:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # SAM checkpoint (~2.4 GB) — read-only, never baked into the image
      - ./sam_vit_h_4b8939.pth:/workspace/third_party/segment-anything/sam_ckpt/sam_vit_h_4b8939.pth:ro
      # Dataset — bind-mount instead of unzipping inside the image
      # Note: not read-only because the COLMAP loader writes points3D.ply on first run
      - ./data/360_extra_scenes:/workspace/data/360_v2
      # Outputs — writable, persisted on the host between runs
      - ./outputs:/workspace/outputs
      # CUDA PTX JIT cache — avoids recompiling sm_120 kernels on every container start
      # This is essential on Blackwell (RTX 5090/sm_120) since CUDA 11.6 extensions
      # must JIT-compile PTX for sm_120 on first run (can take 15+ minutes).
      - cuda_jit_cache:/root/.nv
      # X11 socket for GUI apps (saga_gui.py via dearpygui)
      # Requires: xhost +local: on the host before running
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      # WSL2 D3D12 interface — enables hardware-accelerated OpenGL via Mesa in the container
      - /dev/dxg:/dev/dxg
    stdin_open: true
    tty: true

volumes:
  cuda_jit_cache:
